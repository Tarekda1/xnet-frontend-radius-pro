services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
      - "24679:24678"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=https://api.xnetcloud.tech/api
      - VITE_WS_URL=ws://rabbitmq:15674
      # Optional: NAS config for CoA actions (Online Users -> Disconnect)
      - VITE_DEFAULT_NAS_IP=${VITE_DEFAULT_NAS_IP:-172.8.16.200}
      - VITE_DEFAULT_NAS_SECRET=${VITE_DEFAULT_NAS_SECRET:-}
      - VITE_DEFAULT_NAS_COA_PORT=${VITE_DEFAULT_NAS_COA_PORT:-1700}
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    networks:
      - frontend-network

volumes:
  node_modules:

networks:
  frontend-network:
    driver: bridge
