services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/next-app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.xnetcloud.tech/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://rabbitmq:15674}
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://host.docker.internal:3000}
      - VITE_DEFAULT_NAS_IP=${VITE_DEFAULT_NAS_IP:-172.8.16.200}
      - VITE_DEFAULT_NAS_SECRET=${VITE_DEFAULT_NAS_SECRET:-}
      - VITE_DEFAULT_NAS_COA_PORT=${VITE_DEFAULT_NAS_COA_PORT:-1700}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
