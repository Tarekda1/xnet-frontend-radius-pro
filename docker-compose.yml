# Enable BuildKit by default
x-build-args: &build-args
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

services:
  # Development service
  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        <<: *build-args
        NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - npm-cache:/root/.npm
    ports:
      - "${PORT:-5173}:5173"
      - "24679:24678"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-https://radius.xnetcloud.tech/api}
      # Optional: NAS config for CoA actions (Online Users -> Disconnect)
      - VITE_DEFAULT_NAS_IP=${VITE_DEFAULT_NAS_IP:-172.8.16.200}
      - VITE_DEFAULT_NAS_SECRET=${VITE_DEFAULT_NAS_SECRET:-}
      - VITE_DEFAULT_NAS_COA_PORT=${VITE_DEFAULT_NAS_COA_PORT:-1700}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-network

  # Production service
  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *build-args
        NODE_ENV: production
        VITE_API_URL: ${VITE_API_URL:-https://radius.xnetcloud.tech/api}
      cache_from:
        - type=registry,ref=node:20-alpine
        - type=registry,ref=nginx:alpine-slim
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:8080"
    environment:
      - NODE_ENV=production
      # Runtime config (served via /env.js)
      - API_URL=${API_URL:-${VITE_API_URL:-https://api.xnetcloud.tech/api}}
      # Feature flags (served via /env.js)
      - FEATURE_FLAGS=${FEATURE_FLAGS:-}
      # Optional: error reporting (served via /env.js)
      - SENTRY_DSN=${SENTRY_DSN:-https://d300b4a14f76b044f347b4c519f4c131@o4510782900535296.ingest.us.sentry.io/4510782901583872}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      # Optional: app metadata (served via /env.js)
      - APP_VERSION=${APP_VERSION:-}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-}
      - APP_GIT_SHA=${APP_GIT_SHA:-}
      # Optional: NAS config for CoA actions (Online Users -> Disconnect)
      - DEFAULT_NAS_IP=${DEFAULT_NAS_IP:-${VITE_DEFAULT_NAS_IP:-}}
      - DEFAULT_NAS_SECRET=${DEFAULT_NAS_SECRET:-${VITE_DEFAULT_NAS_SECRET:-}}
      - DEFAULT_NAS_COA_PORT=${DEFAULT_NAS_COA_PORT:-${VITE_DEFAULT_NAS_COA_PORT:-1700}}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 500M
        reservations:
          cpus: '0.25'
          memory: 200M

networks:
  frontend-network:
    driver: bridge 

volumes:
  npm-cache: