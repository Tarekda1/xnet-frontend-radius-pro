# Enable BuildKit by default
x-build-args: &build-args
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

services:
  # Development — Next.js (`next dev`)
  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        <<: *build-args
        NODE_ENV: development
    volumes:
      - .:/app
      - /app/next-app/node_modules
      - npm-cache:/root/.npm
    ports:
      - "${PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-${VITE_API_URL:-https://api.xnetcloud.tech/api}}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-${VITE_WS_URL:-}}
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://host.docker.internal:3000}
      - VITE_DEFAULT_NAS_IP=${VITE_DEFAULT_NAS_IP:-172.8.16.200}
      - VITE_DEFAULT_NAS_SECRET=${VITE_DEFAULT_NAS_SECRET:-}
      - VITE_DEFAULT_NAS_COA_PORT=${VITE_DEFAULT_NAS_COA_PORT:-1700}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - frontend-network

  # Production — Next.js standalone (replaces former nginx + Vite static bundle)
  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *build-args
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${VITE_API_URL:-https://api.xnetcloud.tech/api}}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-${VITE_WS_URL:-}}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:3000}
      cache_from:
        - type=registry,ref=node:20-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:5173"
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL:-${VITE_API_URL:-https://api.xnetcloud.tech/api}}
      - FEATURE_FLAGS=${FEATURE_FLAGS:-}
      - SENTRY_DSN=${SENTRY_DSN:-https://d300b4a14f76b044f347b4c519f4c131@o4510782900535296.ingest.us.sentry.io/4510782901583872}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - APP_VERSION=${APP_VERSION:-}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-}
      - APP_GIT_SHA=${APP_GIT_SHA:-}
      - DEFAULT_NAS_IP=${DEFAULT_NAS_IP:-${VITE_DEFAULT_NAS_IP:-}}
      - DEFAULT_NAS_SECRET=${DEFAULT_NAS_SECRET:-${VITE_DEFAULT_NAS_SECRET:-}}
      - DEFAULT_NAS_COA_PORT=${DEFAULT_NAS_COA_PORT:-${VITE_DEFAULT_NAS_COA_PORT:-1700}}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 500M
        reservations:
          cpus: "0.25"
          memory: 200M

networks:
  frontend-network:
    driver: bridge

volumes:
  npm-cache:
